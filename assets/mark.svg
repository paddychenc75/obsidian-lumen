  <rect x="14" y="26" width="28" height="28" rx="14" fill="rgba(0,0,0,0.18)"/>
  <circle cx="28" cy="36" r="3.2" fill="#fff"/>
  <rect x="24.4" y="41.2" width="7.2" height="1.6" rx="0.8" fill="#fff"/>
  <path d="M48 33.5h10M48 40h10M48 46.5h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
  <rect x="10" y="22" width="60" height="36" rx="18" stroke="rgba(255,255,255,0.28)" filter="url(#lg-soft)"/>
