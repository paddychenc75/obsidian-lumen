<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-labelledby="lumenTitle lumenDesc">
  <title id="lumenTitle">Lumen Glass</title>
  <desc id="lumenDesc">A liquid-glass stadium mark with a selected inner capsule and a fixed upper-left specular.</desc>
  <defs>
    <linearGradient id="lg-env" x1="8" y1="6" x2="72" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7BA7C9"/>
      <stop offset="0.46" stop-color="#6A4FA8"/>
      <stop offset="1" stop-color="#1C4A86"/>
    </linearGradient>
    <linearGradient id="lg-sheen" x1="18" y1="14" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lg-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
