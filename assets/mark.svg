  </defs>
  <rect width="80" height="80" rx="22" fill="url(#lg-env)"/>
  <rect x="10" y="22" width="60" height="36" rx="18" fill="rgba(84,84,84,0.18)" stroke="rgba(255,255,255,0.55)"/>
