name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" manifest.json theme.css assets/screenshot.png --clobber
          else
            gh release create "$TAG" \
              manifest.json theme.css assets/screenshot.png \
              --verify-tag \
              --title "Lumen $TAG" \
              --generate-notes
          fi
